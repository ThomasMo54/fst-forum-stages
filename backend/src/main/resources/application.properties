spring.application.name=forum-stages

spring.profiles.default=dev

server.servlet.context-path=/api

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration-ms=1800000
application.security.jwt.refresh-token-expiration-ms=86400000

spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

s3.url=${MINIO_URL}
s3.accessKey=${MINIO_ACCESS_KEY}
s3.secretKey=${MINIO_SECRET_KEY}
s3.bucket.resumes=${MINIO_BUCKET_RESUMES}
s3.bucket.coverLetters=${MINIO_BUCKET_COVERLETTERS}
