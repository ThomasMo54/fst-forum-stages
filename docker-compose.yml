version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forum-stages-backend-dev
    ports:
      - "8080:8080"
    depends_on:
      - minio
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_URI=mongodb+srv://forumstages_backend:aSrofkAKcuO4rAwS@forumstages.h1fu1c6.mongodb.net/?appName=ForumStages
      - MONGODB_DATABASE=forum_stages
      - JWT_SECRET_KEY=39ffc36a1d2d4fc64ff9c8e7614f723abd10439f6373609c3d2001283487e5e3
      - EMAIL_HOST=ssl0.ovh.net
      - EMAIL_PORT=587
      - EMAIL_USERNAME=noreply@fstforumstages.ovh
      - EMAIL_PASSWORD=:t5W2%L5|LTBC9w1
      - MINIO_URL=http://forum-stages-minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_RESUMES=resumes
      - MINIO_BUCKET_COVERLETTERS=cover-letters
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: forum-stages-frontend-dev
    ports:
      - "80:80"
    depends_on:
      - backend
  minio:
    image: minio/minio:latest
    container_name: forum-stages-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  minio_data:
